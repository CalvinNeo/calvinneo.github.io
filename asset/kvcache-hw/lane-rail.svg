<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="lane-rail-title lane-rail-desc" style="display:block;max-width:100%;height:auto;margin:20px auto" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="lane-rail-title">物理 PCIe lane、网络 rail 与软件 Host lane 的位置</title>
  <desc id="lane-rail-desc">图中绿色区域表示一条 rail 中的节点间路径，由源端网口、交换网络和目标网口组成。同一 rail 还可以连接其他节点上对应的网口。软件 Host lane 通过紫色虚线选择源端网卡，蓝色连线表示节点内的 PCIe 链路。目标端采用 DGX B300 的 CPU、CX-8 与 GPU 连接关系。</desc>
  <defs>
    <marker id="map-pcie-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="map-network-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/></marker>
    <marker id="map-software-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
    <marker id="map-internal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="680" fill="#ffffff"/>
  <rect x="20" y="28" width="282" height="544" rx="9" fill="none" stroke="#cbd5e1"/>
  <rect x="535" y="28" width="344" height="562" rx="9" fill="none" stroke="#cbd5e1"/>
  <text x="40" y="57" font-size="19" font-weight="600" fill="#0f172a">远端发送方</text>
  <text x="553" y="57" font-size="19" font-weight="600" fill="#0f172a">目标 DGX B300</text>
  <rect x="45" y="85" width="232" height="52" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="161" y="118" text-anchor="middle" font-size="18" fill="#0f172a">Host DRAM</text>
  <rect x="45" y="193" width="232" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="161" y="228" text-anchor="middle" font-size="18" fill="#0f172a">CPU / I/O 路径</text>
  <path d="M161 139 V191" stroke="#64748b" stroke-width="2" marker-start="url(#map-internal-arrow)" marker-end="url(#map-internal-arrow)"/>
  <text x="179" y="170" font-size="16" fill="#475569">DDR</text>
  <text x="179" y="303" font-size="17" fill="#1e40af">PCIe</text>
  <rect x="550" y="193" width="311" height="266" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="568" y="219" font-size="18" fill="#0f172a">CX-8</text>
  <rect x="638" y="86" width="191" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="733" y="122" text-anchor="middle" font-size="18" fill="#0f172a">本机 CPU</text>
  <rect x="638" y="246" width="191" height="60" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="733" y="282" text-anchor="middle" font-size="18" fill="#0f172a">PCIe 交换器</text>
  <path d="M733 146 V244" stroke="#2563eb" stroke-width="2.2" marker-start="url(#map-pcie-arrow)" marker-end="url(#map-pcie-arrow)"/>
  <text x="555" y="176" font-size="17" fill="#1e40af">PCIe Gen5</text>
  <rect x="36" y="337" width="718" height="94" rx="8" fill="#ecfdf5"/>
  <rect x="45" y="355" width="232" height="58" rx="7" fill="#ffffff" stroke="#6db5a6"/>
  <text x="161" y="390" text-anchor="middle" font-size="18" fill="#0f172a">Host 网卡 / 网口</text>
  <rect x="353" y="355" width="135" height="58" rx="7" fill="#ffffff" stroke="#6db5a6"/>
  <text x="420" y="390" text-anchor="middle" font-size="18" fill="#0f172a">交换网络</text>
  <rect x="578" y="355" width="167" height="58" rx="7" fill="#ffffff" stroke="#6db5a6"/>
  <text x="661" y="390" text-anchor="middle" font-size="18" fill="#0f172a">网络收发功能</text>
  <path d="M161 253 V353" stroke="#2563eb" stroke-width="2.2" marker-start="url(#map-pcie-arrow)" marker-end="url(#map-pcie-arrow)"/>
  <path d="M279 384 H351" stroke="#0f766e" stroke-width="2.2" marker-start="url(#map-network-arrow)" marker-end="url(#map-network-arrow)"/>
  <path d="M490 384 H576" stroke="#0f766e" stroke-width="2.2" marker-start="url(#map-network-arrow)" marker-end="url(#map-network-arrow)"/>
  <path d="M661 353 V308" stroke="#64748b" stroke-width="2" marker-start="url(#map-internal-arrow)" marker-end="url(#map-internal-arrow)"/>
  <text x="329" y="454" font-size="16" fill="#0f766e">同一 rail 中的节点间路径</text>
  <rect x="686" y="510" width="170" height="59" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="771" y="546" text-anchor="middle" font-size="18" fill="#0f172a">GPU / HBM</text>
  <path d="M784 308 V508" stroke="#2563eb" stroke-width="2.2" marker-start="url(#map-pcie-arrow)" marker-end="url(#map-pcie-arrow)"/>
  <text x="595" y="488" font-size="17" fill="#1e40af">PCIe Gen6</text>
  <rect x="45" y="477" width="232" height="68" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-dasharray="5 4"/>
  <text x="161" y="505" text-anchor="middle" font-size="18" fill="#5b21b6">软件 Host lane</text>
  <text x="161" y="529" text-anchor="middle" font-size="16" fill="#475569">一份并行搬运工作</text>
  <path d="M161 475 V415" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#map-software-arrow)"/>
  <text x="179" y="454" font-size="16" fill="#5b21b6">选择路径</text>
  <path d="M43 621 H88" stroke="#2563eb" stroke-width="2.2"/>
  <text x="99" y="627" font-size="16" fill="#0f172a">PCIe：物理 lane 在连线内部</text>
  <path d="M467 621 H512" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="523" y="627" font-size="16" fill="#0f172a">虚线：软件使用设备，不是导线</text>
  <text x="450" y="658" text-anchor="middle" font-size="15" fill="#475569">一个 rail 通过交换网络连接多台机器上对应的一组网口</text>
</svg>
