<svg xmlns="http://www.w3.org/2000/svg" width="900" height="395" viewBox="0 0 900 395" role="img" aria-labelledby="pcie-lane-title pcie-lane-desc" style="display:block;max-width:100%;height:auto;margin:20px auto" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="pcie-lane-title">一条 PCIe lane 包含两个方向的差分信号对</title>
  <desc id="pcie-lane-desc">左边是 CX-8 端口，右边是 GPU 端口。发送差分对有两根信号线，从左向右；接收差分对有另外两根信号线，从右向左。两对共四根数据信号线组成一条 lane。</desc>
  <defs>
    <marker id="lane-tx-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="lane-rx-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="900" height="395" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">一条 PCIe lane</text>
  <rect x="28" y="65" width="184" height="235" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="688" y="65" width="184" height="235" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="120" y="98" text-anchor="middle" font-size="20" fill="#0f172a">CX-8 端口</text>
  <text x="780" y="98" text-anchor="middle" font-size="20" fill="#0f172a">GPU 端口</text>
  <rect x="231" y="115" width="438" height="70" rx="7" fill="#eff6ff"/>
  <rect x="231" y="211" width="438" height="70" rx="7" fill="#ecfdf5"/>
  <text x="450" y="105" text-anchor="middle" font-size="17" fill="#1e40af">发送差分对：两根线共同传递一路信号</text>
  <text x="450" y="202" text-anchor="middle" font-size="17" fill="#0f766e">接收差分对：另外两根线，方向相反</text>
  <path d="M214 137 H686" stroke="#2563eb" stroke-width="2.3" marker-end="url(#lane-tx-arrow)"/>
  <path d="M214 163 H686" stroke="#2563eb" stroke-width="2.3" marker-end="url(#lane-tx-arrow)"/>
  <path d="M686 235 H214" stroke="#0f766e" stroke-width="2.3" marker-end="url(#lane-rx-arrow)"/>
  <path d="M686 261 H214" stroke="#0f766e" stroke-width="2.3" marker-end="url(#lane-rx-arrow)"/>
  <text x="120" y="143" text-anchor="middle" font-size="17" fill="#1e40af">TX +</text>
  <text x="120" y="169" text-anchor="middle" font-size="17" fill="#1e40af">TX −</text>
  <text x="780" y="143" text-anchor="middle" font-size="17" fill="#1e40af">RX +</text>
  <text x="780" y="169" text-anchor="middle" font-size="17" fill="#1e40af">RX −</text>
  <text x="120" y="241" text-anchor="middle" font-size="17" fill="#0f766e">RX +</text>
  <text x="120" y="267" text-anchor="middle" font-size="17" fill="#0f766e">RX −</text>
  <text x="780" y="241" text-anchor="middle" font-size="17" fill="#0f766e">TX +</text>
  <text x="780" y="267" text-anchor="middle" font-size="17" fill="#0f766e">TX −</text>
  <text x="450" y="339" text-anchor="middle" font-size="19" fill="#0f172a">一条 lane = 一对发送线 + 一对接收线</text>
  <text x="450" y="370" text-anchor="middle" font-size="16" fill="#475569">共四根数据信号线，不计参考时钟、地线及其他连接</text>
</svg>
