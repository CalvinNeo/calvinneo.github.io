<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="hbm-package-title hbm-package-desc" style="display:block;max-width:100%;height:auto;margin:20px auto" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="hbm-package-title">B200 和 B300 的本地 HBM 访问不经过 PCIe</title>
  <desc id="hbm-package-desc">单个 GPU 封装中，计算单元经过片上缓存及内存控制器访问 HBM。外部数据来自 Host 或 CX 系列网卡，经 GPU 侧 PCIe 接口进入 HBM。HGX B200 的 GPU 接入使用 Gen5，DGX B300 的 CX-8 到 GPU 使用 Gen6。图中绿色路径对应封装内 HBM 访问，蓝色路径对应外部搬运。</desc>
  <defs>
    <marker id="hbm-pcie-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="hbm-local-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/></marker>
    <marker id="hbm-internal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="610" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">数据搬入 HBM，与 GPU 读取本地 HBM</text>
  <rect x="247" y="72" width="630" height="465" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="270" y="104" font-size="20" font-weight="600" fill="#0f172a">单个 GPU 封装</text>
  <text x="270" y="130" font-size="16" fill="#475569">B200 / B300：计算裸片与 HBM 同封装</text>
  <rect x="268" y="152" width="333" height="322" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="287" y="180" font-size="17" fill="#1e40af">GPU 计算裸片（合并示意）</text>
  <rect x="292" y="202" width="284" height="63" rx="7" fill="#ffffff" stroke="#93c5fd"/>
  <text x="434" y="229" text-anchor="middle" font-size="19" fill="#0f172a">计算单元 / 片上缓存</text>
  <text x="434" y="251" text-anchor="middle" font-size="15" fill="#475569">需要访问 HBM 时走下面的路径</text>
  <rect x="288" y="342" width="124" height="61" rx="7" fill="#ffffff" stroke="#93c5fd"/>
  <text x="350" y="379" text-anchor="middle" font-size="17" fill="#0f172a">PCIe 接口</text>
  <rect x="446" y="342" width="131" height="61" rx="7" fill="#ecfdf5" stroke="#6db5a6"/>
  <text x="511" y="379" text-anchor="middle" font-size="17" fill="#0f172a">内存控制器</text>
  <path d="M511 267 V340" stroke="#0f766e" stroke-width="2.4" marker-start="url(#hbm-local-arrow)" marker-end="url(#hbm-local-arrow)"/>
  <text x="312" y="306" font-size="17" fill="#0f766e">本地计算的访存路径</text>
  <path d="M414 372 H444" stroke="#64748b" stroke-width="2" marker-start="url(#hbm-internal-arrow)" marker-end="url(#hbm-internal-arrow)"/>
  <rect x="684" y="305" width="156" height="89" rx="5" fill="#d1fae5" stroke="#6db5a6"/>
  <rect x="678" y="315" width="156" height="89" rx="5" fill="#d1fae5" stroke="#6db5a6"/>
  <rect x="672" y="325" width="156" height="89" rx="5" fill="#ecfdf5" stroke="#6db5a6"/>
  <text x="750" y="360" text-anchor="middle" font-size="20" fill="#0f172a">HBM 堆叠</text>
  <text x="750" y="388" text-anchor="middle" font-size="15" fill="#475569">多层 DRAM 裸片</text>
  <path d="M579 372 H670" stroke="#0f766e" stroke-width="3" marker-start="url(#hbm-local-arrow)" marker-end="url(#hbm-local-arrow)"/>
  <text x="644" y="272" text-anchor="middle" font-size="17" fill="#0f766e">专用 HBM 接口</text>
  <text x="644" y="295" text-anchor="middle" font-size="15" fill="#475569">封装内连接</text>
  <text x="715" y="453" text-anchor="middle" font-size="16" fill="#0f766e">HBM 带宽：合计所有内存通道</text>
  <rect x="18" y="335" width="175" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="105" y="264" text-anchor="middle" font-size="16" fill="#1e40af">GPU 侧 PCIe 链路</text>
  <text x="105" y="287" text-anchor="middle" font-size="15" fill="#475569">HGX B200：Gen5</text>
  <text x="105" y="310" text-anchor="middle" font-size="15" fill="#475569">DGX B300：Gen6</text>
  <text x="105" y="366" text-anchor="middle" font-size="18" fill="#0f172a">Host / CX 网卡</text>
  <text x="105" y="392" text-anchor="middle" font-size="15" fill="#475569">经平台 PCIe 路径接入</text>
  <path d="M195 372 H286" stroke="#2563eb" stroke-width="2.5" marker-start="url(#hbm-pcie-arrow)" marker-end="url(#hbm-pcie-arrow)"/>
  <text x="227" y="324" text-anchor="middle" font-size="18" fill="#1e40af">PCIe</text>
  <rect x="267" y="490" width="590" height="31" rx="4" fill="#e2e8f0"/>
  <text x="562" y="512" text-anchor="middle" font-size="16" fill="#334155">中介层：在封装内提供高密度互连</text>
  <path d="M30 566 H76" stroke="#2563eb" stroke-width="2.5"/>
  <text x="88" y="572" font-size="17" fill="#0f172a">蓝色：从外部搬入或向外搬出</text>
  <path d="M462 566 H508" stroke="#0f766e" stroke-width="2.5"/>
  <text x="520" y="572" font-size="17" fill="#0f172a">绿色：GPU 访问自己的本地 HBM</text>
</svg>
