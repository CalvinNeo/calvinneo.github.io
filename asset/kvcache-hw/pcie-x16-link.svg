<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="pcie-width-title pcie-width-desc" style="display:block;max-width:100%;height:auto;margin:20px auto" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="pcie-width-title">一条 PCIe ×16 链路由十六条 lane 组成</title>
  <desc id="pcie-width-desc">CX-8 端口与 GPU 端口之间画出编号零到十五的十六条 lane。每条横线代表一条完整的双向 lane，不代表单根导线。十六条共同组成一条 PCIe 链路。</desc>
  <rect width="900" height="475" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">一条 PCIe ×16 链路</text>
  <text x="450" y="63" text-anchor="middle" font-size="16" fill="#475569">每条细线表示一整条 lane；图中编号仅用于示意</text>
  <rect x="30" y="88" width="177" height="332" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="693" y="88" width="177" height="332" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="118" y="247" text-anchor="middle" font-size="20" fill="#0f172a">CX-8</text>
  <text x="118" y="276" text-anchor="middle" font-size="18" fill="#475569">PCIe 端口</text>
  <text x="781" y="247" text-anchor="middle" font-size="20" fill="#0f172a">GPU</text>
  <text x="781" y="276" text-anchor="middle" font-size="18" fill="#475569">PCIe 端口</text>
  <path d="M209 106 H691 M209 126 H691 M209 146 H691 M209 166 H691 M209 186 H691 M209 206 H691 M209 226 H691 M209 246 H691 M209 266 H691 M209 286 H691 M209 306 H691 M209 326 H691 M209 346 H691 M209 366 H691 M209 386 H691 M209 406 H691" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
  <rect x="402" y="93" width="96" height="325" fill="#ffffff"/>
  <g text-anchor="middle" font-size="15" fill="#1e40af">
    <text x="450" y="111">lane 0</text>
    <text x="450" y="131">lane 1</text>
    <text x="450" y="151">lane 2</text>
    <text x="450" y="171">lane 3</text>
    <text x="450" y="191">lane 4</text>
    <text x="450" y="211">lane 5</text>
    <text x="450" y="231">lane 6</text>
    <text x="450" y="251">lane 7</text>
    <text x="450" y="271">lane 8</text>
    <text x="450" y="291">lane 9</text>
    <text x="450" y="311">lane 10</text>
    <text x="450" y="331">lane 11</text>
    <text x="450" y="351">lane 12</text>
    <text x="450" y="371">lane 13</text>
    <text x="450" y="391">lane 14</text>
    <text x="450" y="411">lane 15</text>
  </g>
  <text x="450" y="454" text-anchor="middle" font-size="18" fill="#0f172a">×16 是 lane 的数量，不是 GPU 数量、网卡数量或软件线程数</text>
</svg>
