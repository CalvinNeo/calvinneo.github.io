<svg xmlns="http://www.w3.org/2000/svg" width="900" height="715" viewBox="0 0 900 715" role="img" aria-labelledby="cx8-topology-title cx8-topology-desc" style="display:block;max-width:100%;height:auto;margin:20px auto" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <title id="cx8-topology-title">DGX B300 单个 GPU 分支中的 CPU、CX-8 和 GPU</title>
  <desc id="cx8-topology-desc">CPU 经 PCIe Gen5 连接 CX-8 交换器上游端口，内部转发电路连接下游端口，再经 PCIe Gen6 到 GPU。网络收发功能是同一 CX-8 器件中的另一条分支，CPU 与 GPU 的本机通信不需要经过该分支。</desc>
  <defs>
    <marker id="cx8-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="cx8-internal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <marker id="cx8-network-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="900" height="715" fill="#ffffff"/>
  <rect x="64" y="28" width="282" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="205" y="64" text-anchor="middle" font-size="19" fill="#0f172a">Host DRAM</text>
  <rect x="64" y="137" width="282" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="205" y="164" text-anchor="middle" font-size="19" fill="#0f172a">CPU</text>
  <text x="205" y="188" text-anchor="middle" font-size="16" fill="#475569">内存控制器 / PCIe 根端口</text>
  <path d="M205 88 V135" stroke="#64748b" stroke-width="2" marker-start="url(#cx8-internal-arrow)" marker-end="url(#cx8-internal-arrow)"/>
  <text x="226" y="118" font-size="16" fill="#475569">DDR</text>
  <rect x="28" y="276" width="685" height="298" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="304" font-size="20" font-weight="600" fill="#0f172a">ConnectX-8</text>
  <text x="474" y="304" font-size="16" fill="#475569">一个器件，两类功能</text>
  <rect x="48" y="324" width="315" height="232" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="67" y="349" font-size="17" fill="#1e40af">PCIe 交换器</text>
  <rect x="103" y="366" width="205" height="38" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="103" y="430" width="205" height="38" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="103" y="494" width="205" height="38" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="205" y="391" text-anchor="middle" font-size="17" fill="#0f172a">上游端口</text>
  <text x="205" y="455" text-anchor="middle" font-size="17" fill="#0f172a">内部转发电路</text>
  <text x="205" y="519" text-anchor="middle" font-size="17" fill="#0f172a">下游端口</text>
  <path d="M205 207 V364" stroke="#2563eb" stroke-width="2.5" marker-start="url(#cx8-arrow)" marker-end="url(#cx8-arrow)"/>
  <text x="227" y="248" font-size="18" fill="#1e40af">PCIe Gen5</text>
  <path d="M205 406 V428" stroke="#64748b" stroke-width="2" marker-start="url(#cx8-internal-arrow)" marker-end="url(#cx8-internal-arrow)"/>
  <path d="M205 470 V492" stroke="#64748b" stroke-width="2" marker-start="url(#cx8-internal-arrow)" marker-end="url(#cx8-internal-arrow)"/>
  <rect x="446" y="420" width="224" height="58" rx="7" fill="#ecfdf5" stroke="#99d6c6"/>
  <text x="558" y="445" text-anchor="middle" font-size="18" fill="#0f172a">网络收发功能</text>
  <text x="558" y="466" text-anchor="middle" font-size="15" fill="#475569">NIC</text>
  <path d="M310 449 H444" stroke="#64748b" stroke-width="2" marker-start="url(#cx8-internal-arrow)" marker-end="url(#cx8-internal-arrow)"/>
  <rect x="753" y="420" width="120" height="58" rx="7" fill="#ecfdf5" stroke="#99d6c6"/>
  <text x="813" y="456" text-anchor="middle" font-size="17" fill="#0f172a">外部网络</text>
  <path d="M672 449 H751" stroke="#0f766e" stroke-width="2.5" marker-start="url(#cx8-network-arrow)" marker-end="url(#cx8-network-arrow)"/>
  <text x="711" y="438" text-anchor="middle" font-size="15" fill="#0f766e">网口</text>
  <rect x="64" y="625" width="282" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="205" y="663" text-anchor="middle" font-size="20" fill="#0f172a">GPU / HBM</text>
  <path d="M205 534 V623" stroke="#2563eb" stroke-width="2.5" marker-start="url(#cx8-arrow)" marker-end="url(#cx8-arrow)"/>
  <text x="227" y="604" font-size="18" fill="#1e40af">PCIe Gen6</text>
  <text x="431" y="629" font-size="18" fill="#0f172a">CPU ↔ GPU 经过交换器</text>
  <text x="431" y="658" font-size="17" fill="#475569">不经过右侧的网络收发分支</text>
</svg>
